<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5A45"/>
      <stop offset="100%" stop-color="#233B2B"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7D4B2"/>
      <stop offset="100%" stop-color="#5E9A6F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E1911" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6F997B" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Icon Graphics: Growth Sprout + Naira Symbol Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Central Coin Ring -->
    <circle cx="0" cy="0" r="140" fill="#2A4232" stroke="#A7D4B2" stroke-width="12"/>

    <!-- Inner Coin Disk -->
    <circle cx="0" cy="0" r="115" fill="#34503D"/>

    <!-- Naira '₦' Graphic -->
    <path d="M-60 65 L-60 -65 L-35 -65 L35 40 L35 -65 L60 -65 L60 65 L35 65 L-35 -40 L-35 65 Z" fill="#F4F8F4"/>
    <rect x="-70" y="-14" width="140" height="12" rx="6" fill="#A7D4B2"/>
    <rect x="-70" y="10" width="140" height="12" rx="6" fill="#A7D4B2"/>

    <!-- Sprouting Growth Leaf on top -->
    <path d="M0 -115 C20 -165 75 -195 105 -185 C105 -145 75 -115 25 -115 Z" fill="url(#leafGrad)"/>
    <path d="M-10 -115 C-30 -155 -75 -175 -95 -165 C-95 -135 -65 -115 -20 -115 Z" fill="#5E9A6F"/>
  </g>
</svg>
