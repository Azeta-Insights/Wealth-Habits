<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Deep Forest to Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143D22"/>
      <stop offset="50%" stop-color="#1A532D"/>
      <stop offset="100%" stop-color="#0E2816"/>
    </linearGradient>

    <!-- Warm Golden Sunrise Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Fresh Mint Emerald Leaf Gradient -->
    <linearGradient id="mintGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="mintGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06120A" flood-opacity="0.4"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Outer Stroke -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-opacity="0.2"/>

  <!-- Subtle Top-Right Golden Radiance -->
  <circle cx="420" cy="90" r="140" fill="#F59E0B" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Central Emblem Group -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Base Transparent Glow Ring -->
    <circle cx="0" cy="0" r="150" fill="#1A532D" fill-opacity="0.4" stroke="#A7F3D0" stroke-width="3" stroke-opacity="0.25"/>

    <!-- Outer Leaf Watermark Shape -->
    <path d="M0 -115 C0 -115 -85 -70 -85 25 C-85 75 -45 115 0 115 C45 115 85 75 85 25 C85 -70 0 -115 0 -115 Z" fill="url(#mintGrad1)" fill-opacity="0.18"/>

    <!-- Left Elegant Ascending Sprout -->
    <path d="M0 -85 C-55 -50 -70 15 -45 60 C-30 85 0 95 0 95 C0 95 -25 35 0 -25 C5 -40 0 -85 0 -85 Z" fill="url(#mintGrad2)"/>

    <!-- Right Flowing Wealth Sprout -->
    <path d="M0 -95 C55 -60 70 10 45 55 C30 80 0 95 0 95 C0 95 25 35 0 -25 C-5 -45 0 -95 0 -95 Z" fill="url(#mintGrad1)"/>

    <!-- Central Glowing Prosperity Sun Coin -->
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="24" fill="#FEF3C7"/>
    <circle cx="0" cy="0" r="14" fill="#D97706"/>

    <!-- Top Right Sparkle Star Accent -->
    <path d="M100 -100 L108 -80 L128 -72 L108 -64 L100 -44 L92 -64 L72 -72 L92 -80 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  </g>
</svg>
