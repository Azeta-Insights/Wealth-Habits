    <meta property="og:description" content="Personal finance literacy app turning Nigerian bank alerts and transactions into warm, plain-language insights." />
    <title>Wealth Habits — Nigerian Bank Alerts & Money Insights</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          function FakeHmrSocket() {
            var target = document.createDocumentFragment();
            this.addEventListener = target.addEventListener.bind(target);
            this.removeEventListener = target.removeEventListener.bind(target);
            this.dispatchEvent = target.dispatchEvent.bind(target);
            this.readyState = 1;
            this.OPEN = 1;
            this.CLOSED = 3;
            this.CLOSING = 2;
            this.CONNECTING = 0;
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';
            this.protocol = 'vite-hmr';
            this.url = '';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;
          }
          FakeHmrSocket.prototype.send = function() {};
          FakeHmrSocket.prototype.close = function() { this.readyState = 3; };
          FakeHmrSocket.CONNECTING = 0;
          FakeHmrSocket.OPEN = 1;
          FakeHmrSocket.CLOSING = 2;
          FakeHmrSocket.CLOSED = 3;

          window.WebSocket = function(url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1))
            ) {
              var sock = new FakeHmrSocket();
              sock.url = String(url || '');
              return sock;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = OrigWS.prototype;
        }

        var _origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return (a && (a.stack || a.message)) || String(a); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 && (str.indexOf('[vite]') !== -1 || str.indexOf('closed without opened') !== -1)) {
            return;
          }
          _origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (msg.indexOf('WebSocket') !== -1 && (msg.indexOf('closed without opened') !== -1 || msg.indexOf('[vite]') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason.stack) || String(e.reason))) || '';
          if (reason.indexOf('WebSocket') !== -1 && (reason.indexOf('closed without opened') !== -1 || reason.indexOf('[vite]') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>

  </body>
